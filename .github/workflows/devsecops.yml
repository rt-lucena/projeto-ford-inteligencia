name: DevSecOps - Ford Commercial Intelligence

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Princípio do menor privilégio para o GITHUB_TOKEN.
# O workflow só precisa ler o repositório.
permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend - validação Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Verificar sintaxe Python
        run: python -m compileall -q backend/app

  frontend-quality:
    name: Frontend - lint e build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package.json
          package-manager-cache: true

      # O projeto enviado não contém package-lock.json.
      # Criamos um lock durante o CI para permitir npm ci/npm audit.
      # Depois da primeira execução, recomenda-se versionar o package-lock.json.
      - name: Gerar lockfile do frontend
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependências do frontend
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

  sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar Semgrep
        run: python -m pip install 'semgrep==1.177.0'

      - name: Executar SAST
        run: |
          semgrep scan \
            --config auto \
            --error \
            --exclude 'frontend/node_modules' \
            --exclude 'frontend/dist' \
            --exclude 'backend/venv' \
            --exclude 'backend/data/raw' \
            .

  sca-python:
    name: SCA - Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pip-audit

      - name: Auditar dependências Python
        run: pip-audit -r backend/requirements.txt

  sca-frontend:
    name: SCA - Frontend (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package.json
          package-manager-cache: true

      - name: Gerar lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Auditar dependências JavaScript
        working-directory: frontend
        run: npm audit --audit-level=high

  secret-scanning:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  security-gate:
    name: Gate de Segurança
    runs-on: ubuntu-latest
    needs:
      - backend-quality
      - frontend-quality
      - sast
      - sca-python
      - sca-frontend
      - secret-scanning
    steps:
      - name: Todos os controles de segurança passaram
        run: echo '✅ DevSecOps Gate aprovado. O sistema está apto para a etapa de deploy.'

  deploy-simulated:
    name: Deploy - simulação acadêmica
    runs-on: ubuntu-latest
    needs: security-gate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Simular deploy
        run: |
          echo '🚀 DEPLOY SIMULADO'
          echo 'As validações de qualidade e segurança foram aprovadas.'
          echo 'Neste projeto acadêmico não há infraestrutura de produção conectada ao workflow.'

# Segurança de container: não incluída neste workflow porque a estrutura atual do projeto
# não possui Dockerfile/container. Se um container for criado no futuro, adicionar Trivy
# nesta etapa antes do deploy.
